<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4338ca">
    <title>Fitness Gym offline</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #0f172a;
            background: #f8fafc;
        }
        main {
            width: min(100%, 420px);
            padding: 28px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        }
        h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.2;
        }
        p {
            margin: 12px 0 0;
            color: #475569;
            line-height: 1.55;
        }
        a {
            display: inline-flex;
            margin-top: 20px;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #4f46e5;
            padding: 0 18px;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>Нет подключения</h1>
        <p>Откройте приложение снова, когда интернет появится. Установленная версия сохранит оболочку и быстро вернет вас к расписанию.</p>
        <a href="/">Повторить</a>
    </main>
</body>
</html>
