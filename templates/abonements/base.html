{% extends 'base.html' %}

{% block extra_head %}
<style>
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
}

.header {
    text-align: center;
    margin-bottom: 40px;
}

.header h1 {
    font-size: 2.5em;
    color: #2c3e50;
    margin-bottom: 10px;
}

.subtitle {
    color: #7f8c8d;
    font-size: 1.2em;
}

.back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: #3498db;
    text-decoration: none;
    font-size: 1.1em;
}

.back-link:hover {
    text-decoration: underline;
}

.filter-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.filter-btn {
    padding: 10px 20px;
    border: 2px solid #3498db;
    background: transparent;
    color: #3498db;
    border-radius: 25px;
    cursor: pointer;
    font-size: 1em;
    transition: all 0.3s;
}

.filter-btn:hover,
.filter-btn.active {
    background: #3498db;
    color: white;
}

.abonements-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
    margin-bottom: 40px;
}

.abonement-card {
    background: white;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    position: relative;
    transition: transform 0.3s, box-shadow 0.3s;
    display: flex;
    flex-direction: column;
}

.abonement-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}

.popular-badge {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: #f39c12;
    color: white;
    padding: 5px 20px;
    border-radius: 20px;
    font-size: 0.9em;
    font-weight: 500;
    white-space: nowrap;
}

.card-header {
    text-align: center;
    margin-bottom: 20px;
}

.card-header h2 {
    color: #2c3e50;
    margin-bottom: 10px;
    font-size: 1.8em;
}

.description {
    color: #7f8c8d;
    font-size: 0.95em;
    line-height: 1.5;
}

.price-section {
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid #ecf0f1;
}

.price {
    font-size: 2.5em;
    font-weight: 700;
    color: #2c3e50;
    display: inline-block;
}

.old-price {
    font-size: 1.5em;
    color: #95a5a6;
    text-decoration: line-through;
    margin-right: 10px;
    display: inline-block;
}

.discount-badge {
    display: inline-block;
    background: #e74c3c;
    color: white;
    padding: 3px 10px;
    border-radius: 15px;
    font-size: 0.9em;
    margin-left: 10px;
    vertical-align: middle;
}

.duration {
    color: #7f8c8d;
    margin-top: 5px;
}

.visits-info {
    text-align: center;
    margin-bottom: 20px;
    padding: 10px;
    background: #f8f9fa;
    border-radius: 10px;
}

.visits-count {
    display: block;
    font-size: 1.2em;
    font-weight: 500;
    color: #2c3e50;
}

.price-per-visit {
    font-size: 0.9em;
    color: #27ae60;
}

.features {
    flex-grow: 1;
    margin-bottom: 20px;
}

.features h3 {
    color: #2c3e50;
    margin-bottom: 15px;
    font-size: 1.1em;
}

.features ul {
    list-style: none;
}

.features li {
    padding: 8px 0;
    color: #34495e;
    border-bottom: 1px dashed #ecf0f1;
}

.features li:last-child {
    border-bottom: none;
}

.card-footer {
    display: flex;
    gap: 10px;
    margin-top: auto;
}

.btn-details,
.btn-buy {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1em;
    transition: all 0.3s;
    text-align: center;
    text-decoration: none;
}

.btn-details {
    background: #ecf0f1;
    color: #7f8c8d;
}

.btn-details:hover {
    background: #bdc3c7;
}

.btn-buy {
    background: #3498db;
    color: white;
    font-weight: 500;
}

.btn-buy:hover {
    opacity: 0.9;
    transform: scale(1.05);
}

.comparison-link {
    text-align: center;
    margin-top: 40px;
}

.btn-compare {
    display: inline-block;
    padding: 15px 30px;
    background: #2c3e50;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-size: 1.1em;
    transition: background 0.3s;
}

.btn-compare:hover {
    background: #34495e;
}

/* Детальная страница */
.detail-card {
    background: white;
    border-radius: 15px;
    padding: 40px;
    margin-bottom: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.detail-header {
    text-align: center;
    margin-bottom: 30px;
}

.detail-price {
    margin-bottom: 15px;
}

.detail-meta {
    display: flex;
    justify-content: center;
    gap: 20px;
    color: #7f8c8d;
}

.detail-description,
.detail-features {
    margin-bottom: 30px;
}

.detail-description h3,
.detail-features h3 {
    color: #2c3e50;
    margin-bottom: 15px;
}

.detail-description p {
    color: #34495e;
    line-height: 1.6;
}

.features-list {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
}

.feature-item {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #34495e;
}

.feature-icon {
    color: #27ae60;
    font-weight: bold;
    font-size: 1.2em;
}

.detail-calculation {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 30px;
}

.detail-calculation h3 {
    color: #2c3e50;
    margin-bottom: 10px;
}

.profit {
    color: #27ae60;
}

.detail-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
}

.btn-buy-large,
.btn-consult {
    padding: 15px 40px;
    border: none;
    border-radius: 8px;
    font-size: 1.1em;
    cursor: pointer;
    transition: all 0.3s;
}

.btn-buy-large {
    color: white;
    font-weight: 500;
}

.btn-buy-large:hover {
    transform: scale(1.05);
    opacity: 0.9;
}

.btn-consult {
    background: #ecf0f1;
    color: #7f8c8d;
}

.btn-consult:hover {
    background: #bdc3c7;
}

.similar-abonements h3 {
    color: #2c3e50;
    margin-bottom: 20px;
}

.similar-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
}

.similar-card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.3s;
    text-align: center;
}

.similar-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.similar-card h4 {
    color: #2c3e50;
    margin-bottom: 10px;
}

.similar-price {
    font-size: 1.3em;
    font-weight: 500;
    color: #3498db;
    margin-bottom: 5px;
}

.similar-duration {
    color: #7f8c8d;
    font-size: 0.9em;
}

/* Таблица сравнения */
.comparison-table {
    background: white;
    border-radius: 15px;
    overflow-x: auto;
    margin-bottom: 20px;
}

.comparison-table table {
    width: 100%;
    border-collapse: collapse;
}

.comparison-table th,
.comparison-table td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #ecf0f1;
}

.comparison-table th {
    background: #2c3e50;
    color: white;
    font-weight: 500;
}

.comparison-table th:first-child,
.comparison-table td:first-child {
    padding-left: 20px;
}

.comparison-table th:last-child,
.comparison-table td:last-child {
    padding-right: 20px;
}

.comparison-table tr:last-child td {
    border-bottom: none;
}

.comparison-table td:first-child {
    font-weight: 500;
    color: #2c3e50;
}

.comparison-note {
    text-align: center;
    color: #7f8c8d;
    font-style: italic;
}

/* Адаптивность */
@media (max-width: 768px) {
    .header h1 {
        font-size: 2em;
    }
    
    .abonements-grid {
        grid-template-columns: 1fr;
    }
    
    .detail-actions {
        flex-direction: column;
    }
    
    .features-list {
        grid-template-columns: 1fr;
    }
}
</style>

{% endblock %}
